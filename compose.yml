services:
  autosync:
    build: .
    container_name: autosync
    restart: unless-stopped
    ports:
      - "${AUTOSYNC_PORT:-8095}:8095"
    environment:
      - TOASTFLIX_URL=${TOASTFLIX_URL:-https://toastflix.stremio-italia.eu}
      - OFFSET_API_TOKEN=${OFFSET_API_TOKEN:-}
      - OFFSET_API_ACCESS=${OFFSET_API_ACCESS:-prisonmike}
      - AUTOSYNC_WORKERS=${AUTOSYNC_WORKERS:-2}
      - PRISYNX_SECRET=${PRISYNX_SECRET:-prisynx-hmac-secure-2026}
      - PLUGIN_ADMIN_KEY=${PLUGIN_ADMIN_KEY:-}
      - AUTOSYNC_PROXY=${AUTOSYNC_PROXY:-}
      - CORS_ORIGINS=*
    volumes:
      - ./data:/app/data
    networks:
      - default
      - app-net

networks:
  default:
  app-net:
    name: ubuntu_app-net
    external: true
