services:
  autosync:
    build: .
    container_name: autosync
    restart: unless-stopped
    ports:
      - "${AUTOSYNC_PORT:-8095}:8095"
    environment:
      - TOASTFLIX_URL=${TOASTFLIX_URL:-https://toastflix.stremio-italia.eu}
      - OFFSET_API_TOKEN=${OFFSET_API_TOKEN:-}
      - OFFSET_API_ACCESS=${OFFSET_API_ACCESS:-password}
      - AUTOSYNC_WORKERS=${AUTOSYNC_WORKERS:-2}
      - PRISYNX_SECRET=${PRISYNX_SECRET:-prisynx-hmac-secure-2026}
      - PLUGIN_ADMIN_KEY=${PLUGIN_ADMIN_KEY:-}
      - AUTOSYNC_PROXY=${AUTOSYNC_PROXY:-socks5://tor-proxy:9050,socks5://tor-proxy-2:9050}
      - AUTOSYNC_WARP_PROXY=${AUTOSYNC_WARP_PROXY:-socks5://172.20.0.2:1080}
      - VX_BASE_URL=${VX_BASE_URL:-}
      - CORS_ORIGINS=*
    volumes:
      - ./data:/app/data
    networks:
      - default
      - warpnet
    depends_on:
      - tor-proxy-2

  tor-proxy-2:
    image: ubuntu-tor-proxy:latest
    container_name: tor-proxy-2
    restart: unless-stopped
    networks:
      - default

networks:
  default:
  warpnet:
    name: ${WARP_NETWORK:-ubuntu_app-net}
    external: true

