services:
  autosync:
    build: .
    container_name: autosync
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - TOASTFLIX_URL=https://toastflix.stremio-italia.eu
      - OFFSET_API_TOKEN=${OFFSET_API_TOKEN:-}
      - OFFSET_API_ACCESS=${OFFSET_API_ACCESS:-}
      - PLUGIN_ADMIN_KEY=${PLUGIN_ADMIN_KEY:-}
      - AUTOSYNC_PROXY=${AUTOSYNC_PROXY:-}
      - CORS_ORIGINS=*
    volumes:
      - ./data:/app/data
